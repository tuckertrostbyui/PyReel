[build-system]
requires = ["uv_build >= 0.9.21, <0.10.0"]
build-backend = "uv_build"

[project]
name = "pyreel"
version = "0.1.0"
description = "Automate short-form video creation for TikTok, Reels, and YouTube Shorts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Tucker Trost", email = "tro18011@byui.edu" }
]

dependencies = [
    "praw>=7.7.0",
    "edge-tts>=6.1.0",
    "whisperx>=3.1.0",
    "moviepy>=2.0.0",
    "yt-dlp>=2024.1.0",
    "requests>=2.31.0",
    "litellm>=1.30.0",
    "python-slugify>=8.0.0",
    "better-profanity>=0.7.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/tuckertrost/pyreel"
Documentation = "https://tuckertrost.github.io/pyreel"

[tool.uv.build-backend]
module-name = "pyreel"
source-dir = "src"

[tool.ruff]
line-length = 88
target-version = "py311"
